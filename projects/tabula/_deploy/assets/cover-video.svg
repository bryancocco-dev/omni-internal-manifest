<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none"><defs><pattern id="vdgrid" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="0.9" cy="0.9" r="0.8" fill="#C4CAD4" opacity="0.45"/></pattern><style>@keyframes vdRoll{to{transform:translateX(-44px)}}
@keyframes vdCapture{0%,100%{opacity:.22}14%{opacity:0}86%{opacity:0}}
@keyframes vdPlayPop{0%,100%{transform:scale(1.15)}14%{transform:scale(1)}86%{transform:scale(1)}}
@keyframes vdGenDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
@keyframes vdPlayhead{0%{transform:translateX(0)}100%{transform:translateX(264px)}}
@keyframes vdSync{0%,100%{transform:scaleY(0.7)}50%{transform:scaleY(1.35)}}
@keyframes vdFrame{0%,100%{opacity:.35}50%{opacity:.85}}
.gfx-vd-strip{}
:where(.tile-card:hover,.is-anim) .gfx-vd-strip{animation:vdRoll 3.2s linear infinite;}
.gfx-vd-capture{opacity:0;}
:where(.tile-card:hover,.is-anim) .gfx-vd-capture{animation:vdCapture 3.2s cubic-bezier(.45,0,.55,1) infinite;}
.gfx-vd-play{transform-box:fill-box;transform-origin:center;}
:where(.tile-card:hover,.is-anim) .gfx-vd-play{animation:vdPlayPop 3.2s cubic-bezier(.45,0,.55,1) infinite;}
.gfx-vd-gendot{transform-box:fill-box;transform-origin:center;}
:where(.tile-card:hover,.is-anim) .gfx-vd-gendot{animation:vdGenDot 1.6s ease-in-out infinite;}
.gfx-vd-playhead{transform-box:view-box;transform-origin:68px 182px;}
:where(.tile-card:hover,.is-anim) .gfx-vd-playhead{animation:vdPlayhead 4s linear infinite;}
.gfx-vd-sync{transform-box:fill-box;transform-origin:bottom;}
:where(.tile-card:hover,.is-anim) .gfx-vd-sync{animation:vdSync 1.8s ease-in-out infinite;animation-delay:var(--d,0s);}
.gfx-vd-perf{transition:opacity .5s;}
:where(.tile-card:hover,.is-anim) .gfx-vd-perf{animation:vdFrame 2.4s ease-in-out infinite;animation-delay:var(--d,0s);}
