<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none"><defs><pattern id="gfgrid" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="0.9" cy="0.9" r="0.8" fill="#C4CAD4" opacity="0.45"/></pattern><linearGradient id="gfscan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1858EE" stop-opacity="0"/><stop offset="0.5" stop-color="#1858EE" stop-opacity="0.14"/><stop offset="1" stop-color="#1858EE" stop-opacity="0"/></linearGradient><style>@keyframes gfScan{0%{transform:translateX(-80px);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(80px);opacity:0}}
@keyframes gfHandle{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
@keyframes gfNode{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.7)}}
@keyframes gfSpin{to{transform:rotate(360deg)}}
@keyframes gfLayer{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes gfHorizon{0%,100%{opacity:.4}50%{opacity:.9}}
.gfx-gf-scan{transform-box:view-box;transform-origin:200px 144px;opacity:0;transition:opacity .5s;}
:where(.tile-card:hover,.is-anim) .gfx-gf-scan{animation:gfScan 3.8s linear infinite;}
.gfx-gf-handle{transform-box:fill-box;transform-origin:center;transition:opacity .5s;}
:where(.tile-card:hover,.is-anim) .gfx-gf-handle{animation:gfHandle 2.2s ease-in-out infinite;animation-delay:var(--d,0s);}
.gfx-gf-node{transform-box:fill-box;transform-origin:center;}
:where(.tile-card:hover,.is-anim) .gfx-gf-node{animation:gfNode 2.4s ease-in-out infinite;animation-delay:var(--d,0s);}
.gfx-gf-aperture{transform-box:fill-box;transform-origin:center;}
:where(.tile-card:hover,.is-anim) .gfx-gf-aperture{animation:gfSpin 7s linear infinite;}
.gfx-gf-layer{transition:transform .5s;}
:where(.tile-card:hover,.is-anim) .gfx-gf-layer{animation:gfLayer 2.4s ease-in-out infinite;animation-delay:var(--d,0s);}
.gfx-gf-horizon{transition:opacity .5s;}
:where(.tile-card:hover,.is-anim) .gfx-gf-horizon{animation:gfHorizon 2.6s ease-in-out infinite;}
