      <rect class="aud-glow" style="animation-delay: -1038.5ms" x="474.5" y="220" width="32" height="300"/>
    </g>
    <g class="aud-bar-g" style="animation-delay: -346.2ms">
      <rect class="aud-bar" x="526.5" y="260" width="32" height="260"/>
      <rect class="aud-glow" style="animation-delay: -346.2ms" x="526.5" y="260" width="32" height="260"/>
    </g>
    <g class="aud-bar-g" style="animation-delay: -8653.8ms">
      <rect class="aud-bar" x="578.5" y="200" width="32" height="320"/>
      <rect class="aud-glow" style="animation-delay: -8653.8ms" x="578.5" y="200" width="32" height="320"/>
    </g>
    <g class="aud-bar-g" style="animation-delay: -7961.5ms">
      <rect class="aud-bar" x="630.5" y="240" width="32" height="280"/>
      <rect class="aud-glow" style="animation-delay: -7961.5ms" x="630.5" y="240" width="32" height="280"/>
    </g>
    <g class="aud-bar-g" style="animation-delay: -7269.2ms">
