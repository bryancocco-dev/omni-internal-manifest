<svg viewBox="0 0 1085 716" xmlns="http://www.w3.org/2000/svg">
  <!-- PLAN §20.3 v2.2 "seven figures, one language." ONE figure, zero decoration: a
       single run of vertical EQ bars (BOLD solid, black). Figure width 656 = 60.5% of
       1085 (58-64% band), optically centered at cx=542.5 (13 bars, baseline y=520,
       vertical bounding-box center ≈358 — same centering math as its siblings).
       ONE motion, "bars dance": each bar scaleY-oscillates from its own baseline
       (transform-box: fill-box; transform-origin: bottom), §18 amplitude range
       0.62-1.32 (inside the 0.55-1.40 floor), sine token, MID 9s.
       "Audio tempo exception" + the coordinator's sanctioned accent: a coral glow
       layered on each bar with its OWN envelope (§18.5: 8% attack / 26% total, at
       9s that's 720ms/2340ms), delayed in lock-step with that bar's own dance delay —
       so the coral doesn't add a second motion, it's the crest of the SAME wave
       (the loudest instant of each bar's own cycle reads as its bright instant).
       Delay math: each keyframe (dance AND glow) peaks at the 50% mark of its OWN
       9s loop, so to make bar i's peak land at GLOBAL time (i/13)*9000 — a clean
       monotonic left→right sweep — the delay is (i/13)*9000 - 4500 (folded back into
       [-9000,0) for the codebase's negative-delay convention), NOT simply
       -(i/13)*9000 (that naive version peaks bar 0 at t=4500 and bar 12 at t≈8308,
       i.e. it sweeps outward from the middle and wraps, not L→R — caught by
       rendering a 6-frame strip and watching the crest jump around instead of
       travel). Spread is LINEAR across the 13 bars rather than the codebase's usual
       -1.9s convenience step — that constant was tuned for a handful of
       near-simultaneous elements (cover-workflow.svg's node breathes); the brief
       here needs "phase offsets strictly ordered L→R," which only a full linear
       spread delivers cleanly across 13 positions.
       Theme rekey (documented once, see cover-graphics.svg for the fuller note):
       unscoped classnames, LIGHT authored as default, body[data-theme="dark"] inverts
       ground/ink only (coral is theme-constant); can't match a standalone document,
       so /_seek.html review is light-scheme by construction. -->
  <style>
    .aud-bg { fill: #ffffff; }
    .aud-bar { fill: #000000; }
    .aud-glow { fill: #1858EE; opacity: 0; }

    .aud-bar-g {
      transform-box: fill-box;
      transform-origin: bottom;
      animation: audDance 9s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes audDance {
      0%, 100% { transform: scaleY(0.62); }
      50%      { transform: scaleY(1.32); }
    }
    .aud-glow { animation: audGlow 9s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes audGlow {
      0%, 100% { opacity: 0; }
      42%      { opacity: 0; }
      50%      { opacity: 0.95; }
      68%      { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .aud-bar-g, .aud-glow { animation: none; }
    }

    body[data-theme="dark"] .aud-bg { fill: #000000; }
    body[data-theme="dark"] .aud-bar { fill: #ffffff; }
  </style>

  <rect class="aud-bg" width="1085" height="716"/>

  <g>
    <g class="aud-bar-g" style="animation-delay: -4500.0ms">
      <rect class="aud-bar" x="214.5" y="430" width="32" height="90"/>
      <rect class="aud-glow" style="animation-delay: -4500.0ms" x="214.5" y="430" width="32" height="90"/>
    </g>
    <g class="aud-bar-g" style="animation-delay: -3807.7ms">
      <rect class="aud-bar" x="266.5" y="380" width="32" height="140"/>
      <rect class="aud-glow" style="animation-delay: -3807.7ms" x="266.5" y="380" width="32" height="140"/>
    </g>
    <g class="aud-bar-g" style="animation-delay: -3115.4ms">
      <rect class="aud-bar" x="318.5" y="330" width="32" height="190"/>
      <rect class="aud-glow" style="animation-delay: -3115.4ms" x="318.5" y="330" width="32" height="190"/>
    </g>
    <g class="aud-bar-g" style="animation-delay: -2423.1ms">
      <rect class="aud-bar" x="370.5" y="290" width="32" height="230"/>
      <rect class="aud-glow" style="animation-delay: -2423.1ms" x="370.5" y="290" width="32" height="230"/>
    </g>
