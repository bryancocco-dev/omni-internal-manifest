      <rect class="aud-glow" style="animation-delay: -6576.9ms" x="734.5" y="350" width="32" height="170"/>
    </g>
    <g class="aud-bar-g" style="animation-delay: -5884.6ms">
      <rect class="aud-bar" x="786.5" y="400" width="32" height="120"/>
      <rect class="aud-glow" style="animation-delay: -5884.6ms" x="786.5" y="400" width="32" height="120"/>
    </g>
    <g class="aud-bar-g" style="animation-delay: -5192.3ms">
      <rect class="aud-bar" x="838.5" y="440" width="32" height="80"/>
      <rect class="aud-glow" style="animation-delay: -5192.3ms" x="838.5" y="440" width="32" height="80"/>
    </g>
  </g>
</svg>
