<svg viewBox="0 0 1085 716" xmlns="http://www.w3.org/2000/svg">
  <!-- PLAN §20.3 v2.2 "seven figures, one language." ONE figure, zero decoration:
       three concentric circles, one at each rung of the §20.1 weight ladder — this
       is the one legitimately radial subject (a research/scan motif), so the ladder
       itself IS the figure rather than a decorative add-on. Outer=250r (scaled 2026-08-19: r320 filled 89% of tile height, far tighter than sibling margins) LIGHT hairline
       (3u, dotted), mid=248r MEDIUM (8u, dashed blocks), inner=176r BOLD (24u, solid).
       Outer diameter 640 = 59% of 1085 (58-64% band), optically centered at cx=542.5
       cy=358 — same centering math as its siblings. The three rings themselves are
       completely static — "nothing else moves."
       ONE motion + the one accent element are the same thing: a single coral radial
       line, center to outer radius, rotating a full turn continuously (FAST 5s,
       linear — a continuous traveler, exempt from the zero-velocity rule), read as a
       scan/radar sweep.
       Theme rekey (documented once, see cover-graphics.svg for the fuller note):
       unscoped classnames, LIGHT authored as default, body[data-theme="dark"] inverts
       ground/ink only (coral is theme-constant); can't match a standalone document,
       so /_seek.html review is light-scheme by construction. -->
  <style>
    .res-bg { fill: #ffffff; }
    .res-ring { fill: none; stroke: #000000; }
    .res-light  { stroke-width: 3;  stroke-dasharray: 1 16; stroke-linecap: round; }
    .res-medium { stroke-width: 8;  stroke-dasharray: 28 20; }
    .res-bold   { stroke-width: 24; }
    /* butt cap (not round): a round cap adds stroke-width/2 (4px) of visual
       extension past the geometric endpoint in the line's own direction, which
       pushed the tip to r≈324 — past the outer ring (r=320, visual edge 321.5)
       on every frame. butt cap terminates exactly at x2/y2, so pivot-to-outer-
       radius is exact at every rotation angle, not just some. */
    .res-sweep { stroke: #1858EE; stroke-width: 8; stroke-linecap: butt; }

    .res-sweep {
      transform-origin: 542.5px 358px;
      animation: resSweep 5s linear infinite;
    }
    @keyframes resSweep {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .res-sweep { animation: none; }
    }

    body[data-theme="dark"] .res-bg { fill: #000000; }
    body[data-theme="dark"] .res-ring { stroke: #ffffff; }
  </style>

  <rect class="res-bg" width="1085" height="716"/>

  <circle class="res-ring res-light" cx="542.5" cy="358" r="250"/>
  <circle class="res-ring res-medium" cx="542.5" cy="358" r="194"/>
  <circle class="res-ring res-bold" cx="542.5" cy="358" r="138"/>

  <line class="res-sweep" x1="542.5" y1="358" x2="542.5" y2="108"/>
</svg>
