<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none"><defs><pattern id="adgrid" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="0.9" cy="0.9" r="0.8" fill="#C4CAD4" opacity="0.45"/></pattern><style>@keyframes adDance{0%,100%{transform:scaleY(0.7)}50%{transform:scaleY(1.28)}}
@keyframes adGlow{0%,42%,100%{opacity:0}50%{opacity:.9}68%{opacity:0}}
@keyframes adFlow{to{stroke-dashoffset:-14}}
@keyframes adPing{0%{transform:scale(1);opacity:.85}70%{opacity:0}100%{transform:scale(2.6);opacity:0}}
@keyframes adThrob{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.6)}}
@keyframes adBracket{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes adFlowIn{0%{transform:translateX(-4px);opacity:.3}50%{transform:translateX(0);opacity:1}100%{transform:translateX(4px);opacity:.3}}
.gfx-ad-bar{transform-box:fill-box;transform-origin:bottom;}
:where(.tile-card:hover,.is-anim) .gfx-ad-bar{animation:adDance 2.6s cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--d,0s);}
.gfx-ad-glow{opacity:0;}
:where(.tile-card:hover,.is-anim) .gfx-ad-glow{animation:adGlow 2.6s cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--d,0s);}
.gfx-ad-env{transition:stroke-dashoffset .6s;}
:where(.tile-card:hover,.is-anim) .gfx-ad-env{animation:adFlow 1.1s linear infinite;}
.gfx-ad-ping{transform-box:fill-box;transform-origin:center;opacity:0;}
:where(.tile-card:hover,.is-anim) .gfx-ad-ping{animation:adPing 2.3s ease-out infinite;}
:where(.tile-card:hover,.is-anim) .gfx-ad-ping--b{animation-delay:-1.15s;}
.gfx-ad-dot{transform-box:fill-box;transform-origin:center;}
:where(.tile-card:hover,.is-anim) .gfx-ad-dot{animation:adThrob 2.3s ease-in-out infinite;}
.gfx-ad-bracket{transition:opacity .5s;}
:where(.tile-card:hover,.is-anim) .gfx-ad-bracket{animation:adBracket 2.3s ease-in-out infinite;}
.gfx-ad-glyph{transform-box:fill-box;transform-origin:center;}
:where(.tile-card:hover,.is-anim) .gfx-ad-glyph{animation:adFlowIn 2.4s ease-in-out infinite;}
