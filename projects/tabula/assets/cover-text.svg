<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none"><defs><pattern id="txgrid" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="0.9" cy="0.9" r="0.8" fill="#C4CAD4" opacity="0.45"/></pattern><linearGradient id="txscan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1858EE" stop-opacity="0"/><stop offset="0.5" stop-color="#1858EE" stop-opacity="0.16"/><stop offset="1" stop-color="#1858EE" stop-opacity="0"/></linearGradient><style>@keyframes txType{0%{transform:scaleX(0);opacity:.4}28%{transform:scaleX(1);opacity:1}82%{transform:scaleX(1);opacity:1}100%{transform:scaleX(0);opacity:.4}}
@keyframes txCaret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes txScan{0%{transform:translateX(-72px);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(72px);opacity:0}}
@keyframes txAnchor{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}
@keyframes txFlow{to{stroke-dashoffset:-12}}
@keyframes txBase{0%,100%{opacity:.5}50%{opacity:1}}
.gfx-tx-line{transform-box:fill-box;transform-origin:left center;}
:where(.tile-card:hover,.is-anim) .gfx-tx-line{animation:txType 3.2s cubic-bezier(.4,0,.6,1) infinite;animation-delay:var(--d,0s);}
.gfx-tx-caret{}
:where(.tile-card:hover,.is-anim) .gfx-tx-caret{animation:txCaret 1s step-end infinite;}
.gfx-tx-scan{transform-box:view-box;transform-origin:264px 145px;opacity:0;transition:opacity .5s;}
:where(.tile-card:hover,.is-anim) .gfx-tx-scan{animation:txScan 3.2s linear infinite;}
.gfx-tx-anchor{transform-box:fill-box;transform-origin:center;transition:opacity .5s;}
:where(.tile-card:hover,.is-anim) .gfx-tx-anchor{animation:txAnchor 2.4s ease-in-out infinite;animation-delay:var(--d,0s);}
.gfx-tx-flow{transition:stroke-dashoffset .6s;}
:where(.tile-card:hover,.is-anim) .gfx-tx-flow{animation:txFlow 1s linear infinite;}
.gfx-tx-tick{transition:opacity .5s;}
:where(.tile-card:hover,.is-anim) .gfx-tx-tick{animation:txBase 2.6s ease-in-out infinite;animation-delay:var(--d,0s);}
