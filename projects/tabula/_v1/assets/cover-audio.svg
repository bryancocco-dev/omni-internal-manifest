<svg viewBox="0 0 1085 716" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* §18.5/§19 spirit, DELIBERATE §14 EXCEPTION: this tile's subject is audio
       PLAYBACK, so it does not sit on the 5s/9s/15s tempo ladder — a live EQ
       genuinely dances at ~1s-ish rates, not 9s. The bar dance below runs at
       FAST sub-second periods (0.9-1.3s) instead of §14's tiers; the sine
       drift stays on the SLOW 15s ambient tier as before. */

    /* THE BAR DANCE: each band is its own live-EQ voice — staggered scaleY,
       sine token cubic-bezier(0.45,0,0.55,1), 0%/100% identical at zero
       velocity so pause/resume never jerks. transform-box:fill-box +
       transform-origin:center scales every bar in a band about its own
       vertical center (same anchor as before). Periods vary slightly per
       band (0.9/1.0/1.1/1.2/1.3s) with uncoordinated negative delays so nb
       the bands drift in and out of phase with each other — organic, not a
       synced pulse. */
    .band-dance {
      transform-box: fill-box;
      transform-origin: center;
    }
    .band-dance.bd1 { animation: barDanceFast 0.9s cubic-bezier(0.45, 0, 0.55, 1) -0.15s infinite; }
    .band-dance.bd0 { animation: barDanceFast 1.1s cubic-bezier(0.45, 0, 0.55, 1) -0.55s infinite; }
    .band-dance.bd4 { animation: barDanceFast 1.0s cubic-bezier(0.45, 0, 0.55, 1) -0.30s infinite; }
    .band-dance.bd3 { animation: barDanceFast 1.2s cubic-bezier(0.45, 0, 0.55, 1) -0.75s infinite; }
    .band-dance.bd2 { animation: barDanceFast 1.3s cubic-bezier(0.45, 0, 0.55, 1) -0.05s infinite; }
    @keyframes barDanceFast {
      0%, 100% { transform: scaleY(1); }
      25%      { transform: scaleY(1.45); }
      75%      { transform: scaleY(0.5); }
    }

    /* THE PLAYHEAD IS PER-BAR NOW (Bryan: the wash read as a blob, not
       individual bars lighting up). .ph-travel no longer paints a visible
       rect — it now drives two narrow rects living inside the phMask mask
       (defs), each ~3 bars wide (40px) with a tight ≤6px feather per edge.
       Same seamless twin-copy technique as before: two copies exactly one
       full travel-distance (933.3px) apart on the shared timeline, so as one
       exits right the other arrives left with an invisible handoff; the
       -2.5s delay phases the rest frame to sit mid-waveform (center x=540,
       lighting bars 526.7/540.0/553.3). Only the PAYLOAD changed — from a
       painted tint to a mask-luminance window — the travel math is
       untouched. linear, 5s, exempt from the zero-velocity rule. */
    .ph-travel {
      animation: playheadTravel 5s linear infinite;
      animation-delay: -2.5s;
    }
    @keyframes playheadTravel {
      0%   { transform: translateX(0); }
      100% { transform: translateX(933.3px); }
    }

    /* SLOW 15s ambient: the faint background sine drifts by exactly one wavelength
       (279px, measured from the curve's own formula) — numerically 0 -> 279 but the
       periodic curve renders pixel-identical at both ends, so the loop is seamless;
       the path is pre-extended (-300..1104) so no edge is ever exposed mid-drift.
       Linear (continuous traveler), exempt from the zero-velocity rule. */
    .sine-drift {
      transform-origin: 0px 0px;
      animation: sineDrift 15s linear infinite;
    }
    @keyframes sineDrift {
      from { transform: translateX(0); }
      to   { transform: translateX(279px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .band-dance, .ph-travel { animation: none; }
      .sine-drift { animation: none; }
    }

    /* light ("blueprint on paper") palette — dark above stays default/unmodified */
    @media (prefers-color-scheme: light) {
      .lp-bg { fill: url(#bgL); }
      .lp-ambient { fill: url(#ambientGlowL); }
      .lp-dot { fill: #64748b; opacity: 0.10; }
      .lp-line1 { stroke: #64748b; }
      .lp-line2 { stroke: #8b95a3; }
      .lp-glow-u { opacity: 0.35; }
    }
  </style>
  <defs>
    <radialGradient id="bg" cx="45%" cy="35%" r="78%">
      <stop offset="0%" stop-color="#1a1c20"/>
      <stop offset="55%" stop-color="#101114"/>
      <stop offset="100%" stop-color="#08090a"/>
    </radialGradient>
    <radialGradient id="bgL" cx="45%" cy="35%" r="78%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="46%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#6172f3" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#6172f3" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#6172f3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGlowL" cx="46%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#6172f3" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#6172f3" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#6172f3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#202226"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="nodeFillL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f4f7"/>
    </linearGradient>
    <!-- narrow traveling reveal window for the per-bar playhead: 40px (~3 bars at
         the 13.3px pitch) with a 6px feather each side (< half a bar) — luminance
         mask, not a painted wash. -->
    <linearGradient id="phMaskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="15%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <mask id="phMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1085" height="716">
      <rect x="0" y="0" width="1085" height="716" fill="#000000"/>
      <g transform="translate(73.35,0)">
        <rect class="ph-travel" x="-20" y="286" width="40" height="144" fill="url(#phMaskGrad)"/>
      </g>
      <g transform="translate(-859.95,0)">
        <rect class="ph-travel" x="-20" y="286" width="40" height="144" fill="url(#phMaskGrad)"/>
      </g>
    </mask>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle class="lp-dot" cx="2" cy="2" r="1" fill="#8a97a8" opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

