<svg viewBox="0 0 1085 716" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Motion language: period ladder FAST 5s / MID 9s / SLOW 15s, stagger via
       -1.9s negative-delay steps only. Ambient breathe/shimmer uses the
       sinusoidal token cubic-bezier(0.45,0,0.55,1) — 0%/100% keyframes
       identical, approached at zero velocity, so pause/resume mid-loop never
       jerks. */
    /* §19 THE FILM ROLLS — subject-motion rework: the gate/playhead no
       longer travels; instead the ENTIRE filmstrip (dividers, sprockets, all
       10 cells incl. one extra pitch of buffer past each visible edge)
       translates left by exactly one cell pitch (100px) per loop, continuous
       linear — a real traveler, exempt from the zero-velocity rule per §14
       rule 1. Clipped to the original visible span (x140–940) so the loop is
       seamless: content always over-covers that window (proof: content span
       is [40+off,1040+off], off∈[-100,0], which contains [140,940] for every
       off, touching exactly at the seam). The old cell-by-cell §17 SCRUB flash
       (7 independent crossing timers) doesn't survive a single-pitch model —
       with cells and the gate both on the same 100px grid, EXACTLY one cell
       transits the fixed gate per loop, arriving precisely at the seam (see
       frameFlash below); that's not a bug, it mirrors cover-research's
       pingLeft (same "arrival IS the seam" logic, same file family). */
    .film-roll {
      animation: filmRoll 5s linear infinite;
    }
    @keyframes filmRoll {
      from { transform: translateX(0); }
      to   { transform: translateX(-100px); }
    }
    /* the gate/playhead: now a fixed read-line through the accent cell —
       no animation, drawn once at its resting position (see markup) */
    /* SLOW 15s: accent frame's glow underlay breathes */
    .frame-glow-breathe {
      transform-origin: 590px 358px;
      animation: frameBreathe 15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes frameBreathe {
      0%, 100% { opacity: 0.24; transform: scale(1); }
      50%      { opacity: 0.42; transform: scale(1.02); }
    }
    /* MID 9s: sprocket ticks shimmer left-to-right in 4 staggered column bands */
    .sprkt { animation: sprktRipple 9s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .sprkt-g0 { animation-delay: 0s; }
    .sprkt-g1 { animation-delay: -1.9s; }
    .sprkt-g2 { animation-delay: -3.8s; }
    .sprkt-g3 { animation-delay: -5.7s; }
    @keyframes sprktRipple {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }
    /* §19: "cells flash as they pass under it" — the playhead is fixed at
       x140 (the film-roll's own rest position, unchanged from pre-§19, so
       t=0 stays pixel-identical); cell1 (rest center 190) is the one within
       one pitch of that reference: crossing % = (190-140)/100 = 50%,
       dead-center of the cycle. .cell-transit rides INSIDE the film-roll
       (so it tracks cell1's own translation) and peaks exactly when the
       group's translate has carried it under the fixed line; the companion
       ring lives OUTSIDE the roll, fixed at the playhead itself, same timing. */
    .cell-transit {
      animation: cellTransit 5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes cellTransit {
      0%, 40%, 70%, 100% { opacity: 0.15; }
      50% { opacity: 0.9; }
    }
    .head-ping {
      transform-box: fill-box;
      transform-origin: center;
      animation: headPing 5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes headPing {
      0%, 40%, 100% { opacity: 0;   transform: scale(0.6); }
      50%           { opacity: 0.7; transform: scale(1); }
      70%           { opacity: 0;   transform: scale(3.3); }
    }
    @media (prefers-reduced-motion: reduce) {
      .film-roll, .frame-glow-breathe, .sprkt, .cell-transit, .head-ping { animation: none; }
    }

    /* light ("blueprint on paper") palette — dark above stays default/unmodified */
    @media (prefers-color-scheme: light) {
      .lp-bg { fill: url(#bgL); }
      .lp-ambient { fill: url(#ambientGlowL); }
      .lp-dot { fill: #64748b; opacity: 0.10; }
      .lp-nf { fill: url(#nodeFillL); }
      .lp-node { fill: url(#nodeFillL); stroke: #b9c2cd; }
      .lp-line1 { stroke: #64748b; }
      .lp-bar[fill] { fill: #c3ccd6; }
      .lp-bar[stroke] { stroke: #c3ccd6; }
      .lp-glow-u { opacity: 0.20; }
      @keyframes frameBreathe {
        0%, 100% { opacity: 0.13; transform: scale(1); }
        50%      { opacity: 0.23; transform: scale(1.02); }
      }
      @keyframes sprktRipple {
        0%, 100% { opacity: 0.5; }
        50%      { opacity: 0.85; }
      }
    }
  </style>
  <defs>
    <radialGradient id="bg" cx="45%" cy="35%" r="78%">
      <stop offset="0%" stop-color="#1a1c20"/>
      <stop offset="55%" stop-color="#101114"/>
      <stop offset="100%" stop-color="#08090a"/>
    </radialGradient>
    <radialGradient id="bgL" cx="45%" cy="35%" r="78%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="46%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#f97066" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#f97066" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f97066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGlowL" cx="46%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#f97066" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#f97066" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#f97066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#202226"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="nodeFillL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f4f7"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle class="lp-dot" cx="2" cy="2" r="1" fill="#8a97a8" opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- §19: masks the film-roll to its original visible footprint (the old
         divider bounds) so the one-pitch buffer cells never show except when
         sliding through -->
    <clipPath id="filmClip">
      <rect x="140" y="270" width="800" height="176"/>
    </clipPath>
    <!-- Bryan: cells were popping at the strip's ends — soft-edged mask
         replaces the hard clip so frames FADE through one cell-pitch (100px)
         at each side instead of appearing/vanishing at a hard boundary. -->
    <!-- Fade v2 (Bryan: still popping): the 100px linear ramp was perceptually
         invisible against light mode's pale strokes — cells crossed it in
         ~0.6s and seemed to appear whole. Now TWO cell-pitches (200px) per
         side with sine-eased stops: a cell spends 1.25s dissolving, and the
         ramp's toe means nothing is visible at all until well inside the
         window. Fully-opaque span = the center 4 cells. -->
    <linearGradient id="filmFade" x1="140" y1="0" x2="940" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"      stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.06"   stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.125"  stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.1875" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.25"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.75"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.8125" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.875"  stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.94"   stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1"      stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="filmMask">
      <rect x="140" y="270" width="800" height="176" fill="url(#filmFade)"/>
    </mask>
  </defs>

  <rect class="lp-bg" width="1085" height="716" fill="url(#bg)"/>
  <rect width="1085" height="716" fill="url(#dots)"/>
  <rect class="lp-ambient" width="1085" height="716" fill="url(#ambientGlow)"/>

  <!-- filmstrip rails, bleeding past the frame -->
  <g class="lp-line1" stroke="#48525f" stroke-width="2" opacity="0.7">
    <line x1="40" y1="288" x2="1045" y2="288"/>
    <line x1="40" y1="428" x2="1045" y2="428"/>
  </g>

  <!-- §19 THE FILM ROLLS: dividers + sprockets + all 10 cells (8 real slots,
       incl. the one under the fixed gate at slot5, now uniform — it was only
       ever hidden behind the gate's opaque fill, never actually absent —
       plus one buffer cell/divider/sprocket-pair past EACH edge so the
       100px pitch-shift never shows a gap) move together as one group,
       clipped back to the original visible span so the rest frame (0%,
       translateX(0)) is pixel-identical to the pre-§19 still. -->
  <g class="film-roll" mask="url(#filmMask)">
    <!-- frame division hairlines: 11 dividers / 10 cell-slots (buffers at
         x40 and x1040) -->
    <g class="lp-line1" stroke="#4b5563" stroke-width="2" opacity="0.6">
      <line x1="40" y1="288" x2="40" y2="428"/>
      <line x1="140" y1="288" x2="140" y2="428"/>
      <line x1="240" y1="288" x2="240" y2="428"/>
      <line x1="340" y1="288" x2="340" y2="428"/>
      <line x1="440" y1="288" x2="440" y2="428"/>
      <line x1="540" y1="288" x2="540" y2="428"/>
      <line x1="640" y1="288" x2="640" y2="428"/>
      <line x1="740" y1="288" x2="740" y2="428"/>
      <line x1="840" y1="288" x2="840" y2="428"/>
      <line x1="940" y1="288" x2="940" y2="428"/>
      <line x1="1040" y1="288" x2="1040" y2="428"/>
    </g>

    <!-- sprocket ticks at each of the 11 dividers, grouped into 4
         column-bands for the shimmer ripple -->
    <g class="lp-node" fill="url(#nodeFill)" stroke="#4b5563" stroke-width="1.5">
      <g class="sprkt sprkt-g0">
        <rect x="35" y="280" width="10" height="16" rx="3"/>
        <rect x="35" y="420" width="10" height="16" rx="3"/>
      </g>
      <g class="sprkt sprkt-g0">
        <rect x="135" y="280" width="10" height="16" rx="3"/>
        <rect x="135" y="420" width="10" height="16" rx="3"/>
      </g>
      <g class="sprkt sprkt-g0">
        <rect x="235" y="280" width="10" height="16" rx="3"/>
        <rect x="235" y="420" width="10" height="16" rx="3"/>
      </g>
      <g class="sprkt sprkt-g1">
        <rect x="335" y="280" width="10" height="16" rx="3"/>
        <rect x="335" y="420" width="10" height="16" rx="3"/>
      </g>
      <g class="sprkt sprkt-g1">
        <rect x="435" y="280" width="10" height="16" rx="3"/>
        <rect x="435" y="420" width="10" height="16" rx="3"/>
      </g>
      <g class="sprkt sprkt-g2">
        <rect x="535" y="280" width="10" height="16" rx="3"/>
        <rect x="535" y="420" width="10" height="16" rx="3"/>
      </g>
      <g class="sprkt sprkt-g2">
        <rect x="635" y="280" width="10" height="16" rx="3"/>
        <rect x="635" y="420" width="10" height="16" rx="3"/>
      </g>
      <g class="sprkt sprkt-g3">
        <rect x="735" y="280" width="10" height="16" rx="3"/>
        <rect x="735" y="420" width="10" height="16" rx="3"/>
      </g>
      <g class="sprkt sprkt-g3">
        <rect x="835" y="280" width="10" height="16" rx="3"/>
        <rect x="835" y="420" width="10" height="16" rx="3"/>
      </g>
      <g class="sprkt sprkt-g3">
        <rect x="935" y="280" width="10" height="16" rx="3"/>
        <rect x="935" y="420" width="10" height="16" rx="3"/>
      </g>
      <g class="sprkt sprkt-g3">
        <rect x="1035" y="280" width="10" height="16" rx="3"/>
        <rect x="1035" y="420" width="10" height="16" rx="3"/>
      </g>
    </g>

    <!-- cells: uniform style at all 10 slot centers (90…990, step 100) —
         the one at 590 sits directly under the fixed gate at rest, exactly
         as the old design's hidden gap did -->
    <g>
      <rect class="lp-node" x="50" y="298" width="80" height="120" rx="8" fill="url(#nodeFill)" stroke="#48525f" stroke-width="2" opacity="0.85"/>
      <rect class="lp-bar" x="54" y="302" width="72" height="1" fill="#7c8794" opacity="0.25"/>
      <line class="lp-bar" x1="73" y1="358" x2="107" y2="358" stroke="#3a4350" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

      <rect class="lp-node" x="150" y="298" width="80" height="120" rx="8" fill="url(#nodeFill)" stroke="#48525f" stroke-width="2" opacity="0.85"/>
      <rect class="lp-bar" x="154" y="302" width="72" height="1" fill="#7c8794" opacity="0.25"/>
      <line class="lp-bar" x1="173" y1="358" x2="207" y2="358" stroke="#3a4350" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

      <rect class="lp-node" x="250" y="298" width="80" height="120" rx="8" fill="url(#nodeFill)" stroke="#48525f" stroke-width="2" opacity="0.85"/>
      <rect class="lp-bar" x="254" y="302" width="72" height="1" fill="#7c8794" opacity="0.25"/>
      <line class="lp-bar" x1="273" y1="358" x2="307" y2="358" stroke="#3a4350" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

      <rect class="lp-node" x="350" y="298" width="80" height="120" rx="8" fill="url(#nodeFill)" stroke="#48525f" stroke-width="2" opacity="0.85"/>
      <rect class="lp-bar" x="354" y="302" width="72" height="1" fill="#7c8794" opacity="0.25"/>
      <line class="lp-bar" x1="373" y1="358" x2="407" y2="358" stroke="#3a4350" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

      <rect class="lp-node" x="450" y="298" width="80" height="120" rx="8" fill="url(#nodeFill)" stroke="#48525f" stroke-width="2" opacity="0.85"/>
      <rect class="lp-bar" x="454" y="302" width="72" height="1" fill="#7c8794" opacity="0.25"/>
      <line class="lp-bar" x1="473" y1="358" x2="507" y2="358" stroke="#3a4350" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

      <rect class="lp-node" x="550" y="298" width="80" height="120" rx="8" fill="url(#nodeFill)" stroke="#48525f" stroke-width="2" opacity="0.85"/>
      <rect class="lp-bar" x="554" y="302" width="72" height="1" fill="#7c8794" opacity="0.25"/>
      <line class="lp-bar" x1="573" y1="358" x2="607" y2="358" stroke="#3a4350" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

      <rect class="lp-node" x="650" y="298" width="80" height="120" rx="8" fill="url(#nodeFill)" stroke="#48525f" stroke-width="2" opacity="0.85"/>
      <rect class="lp-bar" x="654" y="302" width="72" height="1" fill="#7c8794" opacity="0.25"/>
      <line class="lp-bar" x1="673" y1="358" x2="707" y2="358" stroke="#3a4350" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

      <rect class="lp-node" x="750" y="298" width="80" height="120" rx="8" fill="url(#nodeFill)" stroke="#48525f" stroke-width="2" opacity="0.85"/>
      <rect class="lp-bar" x="754" y="302" width="72" height="1" fill="#7c8794" opacity="0.25"/>
      <line class="lp-bar" x1="773" y1="358" x2="807" y2="358" stroke="#3a4350" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

      <rect class="lp-node" x="850" y="298" width="80" height="120" rx="8" fill="url(#nodeFill)" stroke="#48525f" stroke-width="2" opacity="0.85"/>
      <rect class="lp-bar" x="854" y="302" width="72" height="1" fill="#7c8794" opacity="0.25"/>
      <line class="lp-bar" x1="873" y1="358" x2="907" y2="358" stroke="#3a4350" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

      <rect class="lp-node" x="950" y="298" width="80" height="120" rx="8" fill="url(#nodeFill)" stroke="#48525f" stroke-width="2" opacity="0.85"/>
      <rect class="lp-bar" x="954" y="302" width="72" height="1" fill="#7c8794" opacity="0.25"/>
      <line class="lp-bar" x1="973" y1="358" x2="1007" y2="358" stroke="#3a4350" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- §19: transit flash — rides with cell1 (rest bounds 150,298), peaks
         exactly as the roll carries it under the fixed playhead at x140 -->
    <rect class="cell-transit" x="150" y="298" width="80" height="120" rx="8"
          fill="none" stroke="#f97066" stroke-width="2.5" opacity="0.15" filter="url(#glow)"/>
  </g>

  <!-- accent frame: soft glow underlay, breathing (SLOW ambient only — the
       FAST beat now lives at the playhead itself, see below) -->
  <rect class="lp-glow-u frame-glow-breathe wake-glow" x="550" y="298" width="80" height="120" rx="8" fill="none" stroke="#f97066" stroke-width="7" opacity="0.28" filter="url(#glow)"/>
  <!-- accent frame: crisp cell -->
  <rect class="lp-nf" x="550" y="298" width="80" height="120" rx="8" fill="url(#nodeFill)" stroke="#f97066" stroke-width="2.5"/>
  <rect x="554" y="302" width="72" height="1" fill="#ffb3ac" opacity="0.3"/>

  <!-- circumscribed circle guide + construction ticks -->
  <circle cx="590" cy="358" r="26" fill="none" stroke="#f97066" stroke-width="1.5" opacity="0.55" stroke-dasharray="3 4"/>
  <g stroke="#f97066" stroke-width="1.5" opacity="0.45">
    <line x1="590" y1="328" x2="590" y2="322"/>
    <line x1="613.5" y1="371" x2="618.7" y2="374"/>
    <line x1="566.5" y1="371" x2="561.3" y2="374"/>
  </g>

  <!-- constructed play triangle: isoceles, height ≈1.15× width, nudged right of the
       cell's geometric center (594 vs 590) so it reads visually centered -->
  <polygon points="610,358 578,376.4 578,339.6" fill="#f97066"/>
  <circle class="lp-nf" cx="590" cy="358" r="2" fill="#121316" stroke="#f97066" stroke-width="1.5"/>

  <!-- §19: the playhead no longer travels — fixed at its own former rest x
       (140), rendered once. Cells now roll past it instead. -->
  <g>
    <line class="lp-glow-u" x1="140" y1="270" x2="140" y2="446" stroke="#f97066" stroke-width="6" opacity="0.28" filter="url(#glow)"/>
    <line x1="140" y1="270" x2="140" y2="446" stroke="#f97066" stroke-width="2.5"/>
    <polygon points="140,270 151,270 140,281" fill="#f97066"/>
  </g>

  <!-- §19: ring-ping at the playhead, fixed (not part of the roll), same
       crossing timing as .cell-transit above -->
  <rect class="head-ping" x="150" y="298" width="80" height="120" rx="8" fill="none" stroke="#f97066" stroke-width="2.5"/>
</svg>
