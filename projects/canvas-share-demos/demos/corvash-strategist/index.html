<title>Progress 2026 — Corvache · Palomar</title>
<meta name="description" content="A shared progress report and forward-looking brief from Palomar." />
<script>
  /* The demo IS the full flow: a refresh restarts from the Outlook inbox so
     the whole arc (inbox → Open → load-in → doc) replays. Direct navigations
     (the email's Open) load normally; ?stay=1 opts out for iteration. */
  (function () {
    try {
      var nav = performance.getEntriesByType('navigation')[0];
      var isReload = nav
        ? nav.type === 'reload'
        : (performance.navigation && performance.navigation.type === 1);
      if (isReload && new URLSearchParams(location.search).get('stay') !== '1') {
        location.replace('./inbox/');
      }
    } catch (e) { /* never block the doc */ }
  })();
</script>
