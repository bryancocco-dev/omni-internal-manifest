<!doctype html>
<!--
  OMNI component: blockquote
  Project: Media
  Note: .persona-pullquote — large pull-quote with mark + blockquote + attribution

  Part of the OMNI design system — restyle with var(--omni-*), see /CLAUDE.md
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media — blockquote · OMNI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://omni-system-hazel.vercel.app/library/media.css">
<style>
  body { background: var(--omni-page-bg, #fff); margin: 0; }
</style>
</head>
<body>
<section class="persona-pullquote">
            <span class="pq-mark" aria-hidden="true">&ldquo;</span>
            <blockquote class="pq-body">I'm not in the market — I just like watching the shape of the future arrive, one launch reel at a time.</blockquote>
            <div class="pq-attr">
              <span>Reported sentiment</span>
              <span class="pq-attr-sep" aria-hidden="true">·</span>
              <span>n = 1,240 surveyed</span>
            </div>
          </section>
</body>
</html>
