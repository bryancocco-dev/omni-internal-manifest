<!doctype html>
<!--
  OMNI component: interstitial
  Project: Switching
  Note: .ws-transit — full-bleed "switching workspace" cover with OMNI mark, destination name, and a self-drawing progress rule (shown open; used on the return crossing, not the initial Continue)

  Part of the OMNI design system — restyle with var(--omni-*), see /CLAUDE.md
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switching — interstitial · OMNI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://omni-system-hazel.vercel.app/tokens.css">
<link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://omni-system-hazel.vercel.app/library/switching-canvas.css">
<style>
  body { background: var(--omni-page-bg, #fff); margin: 0; }
</style>
</head>
<body>
<div class="ws-transit open" id="wsTransit" aria-hidden="false" style="position:static;opacity:1;pointer-events:auto">
  <div class="ws-transit-inner">
    <img class="ws-transit-mark" src="omni-logo.svg" alt="OMNI" />
    <div class="ws-transit-lbl">Switching workspace</div>
    <div class="ws-transit-name">Corvache Automotive</div>
    <div class="ws-transit-track"></div>
  </div>
</div>
</body>
</html>
