<!doctype html>
<!--
  OMNI component: textarea
  Project: Agent Builder
  Note: .text-area — Role / Mission multiline field inside a form-card

  Part of the OMNI design system — restyle with var(--omni-*), see /CLAUDE.md
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Builder — textarea · OMNI</title>
<link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://omni-system-hazel.vercel.app/library/omni-agent-builder.css">
<style>
  body { background: var(--omni-page-bg, #fff); margin: 0; }
</style>
</head>
<body>
<div class="form-card">
            <div class="field-meta">
              <h3>Role / Mission</h3>
              <span class="field-hint" id="descHint">20 more characters required</span>
            </div>
            <textarea class="text-area" id="agentDescription" placeholder="Define what the agent is."></textarea>
          </div>
</body>
</html>
