<!doctype html>
<!--
  OMNI component: dropdown_titleexport
  Project: Exports
  Note: .title-menu — title-bar dropdown next to the brief crumb: PDF/PNG/PPT/Excel export rows plus Save Canvas Agent/Rename, resting state

  Part of the OMNI design system — restyle with var(--omni-*), see /CLAUDE.md
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exports — dropdown_titleexport · OMNI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://omni-system-hazel.vercel.app/library/canvas-exports.css">
<style>
  body { background: var(--omni-page-bg, #fff); margin: 0; }
</style>
</head>
<body>
<div class="title-wrap" style="display:flex;flex-direction:column;align-items:flex-start;gap:6px;position:relative;">
        <div class="title">
          <span class="root">Build Submarines</span>
          <span class="sep">/</span>
          <div class="crumb-row">
            <span class="crumb">Roblox Racing Wrap Competition</span>
            <button class="title-chevron open" id="titleChevron" aria-haspopup="menu" aria-expanded="true" aria-label="Brief options">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div class="title-menu open" id="titleMenu" role="menu" aria-hidden="false" style="position:static;opacity:1;transform:none;pointer-events:auto;margin-top:6px;">
          <button class="title-menu-item" role="menuitem" data-export="pdf" data-file="exports/Roblox-Racing-Wrap-Competition.pdf" data-generating="Rendering PDF&hellip;" data-time="1600">
            <span class="tmi-icon">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2h5.5L13 5.5V14H4z"/><path d="M9.5 2v3.5H13"/><path d="M6.2 9.2h3.6M6.2 11.4h3.6"/></svg>
              <svg class="tmi-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 8.6l3 3L12.8 5"/></svg>
            </span>
            <span class="tmi-label">Download as PDF</span>
          </button>
          <button class="title-menu-item" role="menuitem" data-export="png" data-file="cover-roblox-racing.png" data-name="Roblox-Racing-Canvas.png" data-generating="Rendering PNG&hellip;" data-time="1300">
            <span class="tmi-icon">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><circle cx="6" cy="6.6" r="1.1"/><path d="M13.5 10.6L10.2 7.3 4.5 13"/></svg>
              <svg class="tmi-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 8.6l3 3L12.8 5"/></svg>
            </span>
            <span class="tmi-label">Download as PNG</span>
          </button>
          <button class="title-menu-item" role="menuitem" data-export="ppt" data-file="exports/Roblox-Racing-Wrap-Competition.pptx" data-generating="Generating deck&hellip;" data-time="3400">
            <span class="tmi-icon">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.8" width="11" height="7.6" rx="1"/><path d="M5.6 8.2V6.8M8 8.2V5.2M10.4 8.2V6"/><path d="M8 10.4v2.2M8 12.6l-2.4 1.6M8 12.6l2.4 1.6"/></svg>
              <svg class="tmi-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 8.6l3 3L12.8 5"/></svg>
            </span>
            <span class="tmi-label">Download as PPT</span>
          </button>
          <button class="title-menu-item" role="menuitem" data-export="xlsx" data-file="exports/Roblox-Racing-Wrap-Competition.xlsx" data-generating="Generating workbook&hellip;" data-time="2800">
            <span class="tmi-icon">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M2.5 6.3h11M2.5 9.9h11M6.8 6.3v7.2"/></svg>
              <svg class="tmi-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 8.6l3 3L12.8 5"/></svg>
            </span>
            <span class="tmi-label">Download as Excel</span>
          </button>
          <div class="title-menu-divider" aria-hidden="true"></div>
          <button class="title-menu-item" role="menuitem">
            <span class="tmi-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.6" width="10" height="7.4" rx="2"/><path d="M8 5.6V3.4"/><circle cx="8" cy="2.7" r="0.7"/><path d="M6 8.6v1.2M10 8.6v1.2"/></svg></span>
            <span class="tmi-label">Save Canvas Agent</span>
          </button>
          <button class="title-menu-item" role="menuitem">
            <span class="tmi-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2l3 3-8 8H3v-3z"/></svg></span>
            <span class="tmi-label">Rename</span>
          </button>
        </div>
      </div>
</body>
</html>
